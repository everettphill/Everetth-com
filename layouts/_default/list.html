{{ define "main" }}
<div class="container">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ if eq .Section "blog" }}<p><a href="/categories/">Browse by topic &rarr;</a></p>{{ end }}
  </header>
  <div class="post-grid">
    {{ range .Paginator.Pages }}{{ partial "post-card.html" (dict "page" . "h" "h2") }}{{ end }}
  </div>
  {{ partial "pagination.html" . }}
</div>
{{ end }}
