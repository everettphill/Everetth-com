{{ define "main" }}
<div class="container container-narrow">
  <header class="page-header">
    <h1>Topics</h1>
    <p>Browse posts by topic.</p>
  </header>
  <ul class="topic-list">
    {{ range .Data.Terms.ByCount }}
    <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a> <span class="topic-count">{{ .Count }}</span></li>
    {{ end }}
  </ul>
</div>
{{ end }}
