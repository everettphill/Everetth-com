{{ if gt .Paginator.TotalPages 1 }}
<nav class="pagination" aria-label="Pagination">
  {{ if .Paginator.HasPrev }}<a href="{{ .Paginator.Prev.URL }}" class="btn btn-secondary">&larr; Newer</a>{{ end }}
  <span>Page {{ .Paginator.PageNumber }} of {{ .Paginator.TotalPages }}</span>
  {{ if .Paginator.HasNext }}<a href="{{ .Paginator.Next.URL }}" class="btn btn-secondary">Older &rarr;</a>{{ end }}
</nav>
{{ end }}
