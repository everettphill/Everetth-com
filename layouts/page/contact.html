{{ define "main" }}
<div class="container container-narrow">
  <header class="page-header">
    <h1>Get in Touch</h1>
    <p>Whether you're interested in fractional COO services, have a question about the blog, or just want to say hello — I'd love to hear from you.</p>
  </header>

  <form name="contact" method="POST" action="/thank-you/" data-netlify="true" netlify-honeypot="bot-field" class="contact-form">
    <p class="hidden">
      <label>Don't fill this out: <input name="bot-field"></label>
    </p>

    <div class="form-group">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required placeholder="Everett Hill">
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">
    </div>

    <div class="form-group">
      <label for="subject">Subject</label>
      <select id="subject" name="subject">
        <option value="fractional-coo">Fractional COO Inquiry</option>
        <option value="blog">Blog / Writing</option>
        <option value="book">James Book</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required placeholder="Your message..."></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Send Message</button>
  </form>
</div>
{{ end }}
